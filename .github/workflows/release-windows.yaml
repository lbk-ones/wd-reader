name: Release Windows App
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag
        required: true
        default: '1.0.0'
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.33
      - name: Prepare version
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          node scripts/set-version.mjs $version
      - name: Build
        run: wails3 build ARCH=${{ matrix.arch }} VERSION=${{ env.APP_VERSION }}
      - name: Package portable app
        shell: pwsh
        run: |
          $stage = "bin/portable"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item bin/wdreader.exe $stage
          Copy-Item build/books "$stage/books" -Recurse
          Compress-Archive -Path "$stage/*" -DestinationPath "bin/wdreader_$env:APP_VERSION`_windows_${{ matrix.arch }}.zip"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          files: bin/*.zip
