name: Release Linux App
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag
        required: true
        default: '1.0.0'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GOARCH: amd64
      GIT_COMMITTER_NAME: bk
      GIT_COMMITTER_EMAIL: 2100370548@qq.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev libfuse2t64
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.29
      - name: Prepare version
        run: |
          version="${RELEASE_TAG#v}"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          node scripts/set-version.mjs "$version"
      - name: Package DEB and AppImage
        run: |
          wails3 task linux:create:deb VERSION="$APP_VERSION"
          wails3 task linux:create:appimage VERSION="$APP_VERSION"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          files: |
            bin/*.deb
            bin/*.AppImage
