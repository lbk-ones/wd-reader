name: Release macOS App
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag
        required: true
        default: '1.0.0'
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.29
      - name: Prepare version
        run: |
          version="${RELEASE_TAG#v}"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          node scripts/set-version.mjs "$version"
      - name: Package DMG
        run: |
          wails3 task darwin:package:dmg ARCH=${{ matrix.arch }} VERSION=${{ env.APP_VERSION }} DMG_FILES="fix-app=build/dmg/fix-app,fix-app_zh=build/dmg/fix-app_zh"
          mv bin/wdreader.dmg "bin/WdReader_${APP_VERSION}_mac_${{ matrix.arch }}.dmg"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          files: bin/*.dmg
