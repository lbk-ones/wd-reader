name: Release macOS App
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag
        required: true
        default: '1.0.0'
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # A pipe also falls back on timeouts; a comma only handles 404/410.
      GOPROXY: 'https://proxy.golang.org|direct'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare Go dependencies and Wails CLI
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download && go mod tidy && go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.33; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Go dependency preparation failed after 3 attempts."
              exit 1
            fi
            echo "::warning::Go dependency preparation failed; retrying (attempt $attempt/3)."
            sleep "$((attempt * 5))"
          done
      - name: Prepare version
        run: |
          version="${RELEASE_TAG#v}"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          node scripts/set-version.mjs "$version"
      - name: Package DMG
        run: |
          wails3 task darwin:package:dmg ARCH=${{ matrix.arch }} VERSION=${{ env.APP_VERSION }} DMG_FILES="fix-app=build/dmg/fix-app,fix-app_zh=build/dmg/fix-app_zh"
          mv bin/wdreader.dmg "bin/WdReader_${APP_VERSION}_mac_${{ matrix.arch }}.dmg"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          files: bin/*.dmg
